version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  dev:
    desc: Serve the site and game locally
    cmds:
      - task: deps
      - npm run dev

  deps:
    internal: true
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.task-deps
    status:
      - node --input-type=module -e "import('esbuild').then(m => m.transformSync(''))"
      - test -f node_modules/typescript/bin/tsc
      - test -f node_modules/prettier/bin/prettier.cjs
    cmds:
      - npm ci --include=dev
      - touch node_modules/.task-deps

  validate:
    internal: true
    cmds:
      - for file in dist/site/js/*.js dist/play/js/*.js dist/shared/js/*.js scripts/*.mjs tests/*.mjs; do node --check "$file" || exit; done
      - node scripts/check.mjs

  test:
    desc: Run all tests
    cmds:
      - task: deps
      - npm test

  test:unit:
    internal: true
    cmds:
      - task: deps
      - npm run test:unit

  format:
    desc: Format TypeScript sources
    cmds:
      - task: deps
      - npm run format

  format:check:
    internal: true
    cmds:
      - task: deps
      - npx --no-install prettier --check src

  check:
    desc: Build once, check formatting and validate the site and tests
    cmds:
      - task: build
      - task: format:check
      - task: validate
      - task: test:unit

  build:
    desc: Compile strict TypeScript and generate dist
    cmds:
      - task: deps
      - npm run build

  package:
    desc: Validate and package dist as release/site.tar.gz
    cmds:
      - task: check
      - mkdir -p release
      - tar -czf release/site.tar.gz -C dist .

  standalone:
    desc: Install dependencies if needed and bundle the entire site into one offline HTML
    cmds:
      - task: check
      - node scripts/build-offline.mjs

  nginx:up:
    desc: Build and start local nginx
    cmds:
      - task: build
      - docker compose -f deploy/compose.local.yml up -d --wait

  nginx:check:
    desc: Check running nginx configuration and HTTP responses
    cmds:
      - docker compose -f deploy/compose.local.yml exec -T nginx nginx -t
      - node scripts/check-http.mjs "http://127.0.0.1:${DDS_PORT:-8088}/"

  nginx:logs:
    desc: Follow local nginx logs
    cmds:
      - docker compose -f deploy/compose.local.yml logs -f nginx

  nginx:down:
    desc: Stop local nginx
    cmds:
      - docker compose -f deploy/compose.local.yml down
