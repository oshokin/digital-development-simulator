name: digital-development-simulator-local
services:
  nginx:
    image: nginx@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "127.0.0.1:${DDS_PORT:-8088}:80"
    volumes:
      - ../dist:/srv/digital-development-simulator/current:ro
      - ./nginx-olegshokin.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-http-limits.conf:/etc/nginx/conf.d/limits.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/play/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
