# Place this server block in /etc/nginx/sites-available/olegshokin.com.
# Start on port 80; use Certbot's nginx integration to add TLS after DNS points here.
# The rate-limit zone belongs in http context; see nginx-http-limits.conf.
server {
    listen 80;
    listen [::]:80;
    server_name olegshokin.com;
    root /srv/digital-development-simulator/current;
    index index.html;
    autoindex off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /play { return 301 /play/; }
    location /play/ {
        limit_req zone=oshokin_pages burst=20 nodelay;
        try_files $uri $uri/ /play/index.html;
    }
    location ~ /\. { deny all; }
    # Keep hidden-file denial above this regex; do not use ^~ for /play/.
    # Code/asset trees never fall back to HTML, including unknown extensions.
    location ~* ^/(?:assets/|site/|shared/|play/(?:js|css)/)|\.(?:css|js|mjs|map|json|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|wasm|m4a|mp3|ogg|wav|mp4|webm)$ {
        try_files $uri =404;
        expires 7d;
    }
    location / {
        limit_req zone=oshokin_pages burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }
}
